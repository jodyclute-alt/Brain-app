<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f5f1"><link rel="manifest" href="manifest.webmanifest"><title>Brain</title><style>:root{font-family:system-ui,Arial;background:#f7f5f1;color:#26252a}*{box-sizing:border-box}body{margin:0;padding:22px;max-width:720px;margin:auto}header{display:flex;align-items:center;gap:12px;margin-bottom:25px}h1{font-size:28px;margin:0}.logo{font-size:44px}.muted{color:#777;font-size:13px}.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.tile{aspect-ratio:1;border:0;border-radius:20px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px;font-size:20px;font-weight:700;box-shadow:0 4px 15px #00000010;position:relative;overflow:hidden}.tile .emoji{font-size:45px}.tile small{font-size:12px;font-weight:400}.toolbar{display:flex;justify-content:space-between;align-items:center;margin:14px 0}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #8466b1}.pill{border:1px solid #ddd;background:white;padding:11px 15px;border-radius:30px;font-size:14px}.back{background:transparent;border:0;font-size:17px;padding:8px 0}input[type=text]{width:100%;border:1px solid #ddd;border-radius:12px;padding:15px;font-size:16px;background:white}.entry{display:flex;gap:8px;margin:20px 0}.entry button{border:0;border-radius:12px;background:#26252a;color:white;padding:0 18px}.item{background:white;border-radius:12px;padding:14px;display:flex;align-items:center;gap:12px;margin:9px 0;overflow-wrap:anywhere}.item.done span{text-decoration:line-through;color:#999}.item span{flex:1}.item button{border:0;background:transparent;color:#777;font-size:21px}.empty{text-align:center;color:#888;padding:30px}dialog{border:0;border-radius:18px;padding:22px;width:min(90vw,390px);box-shadow:0 15px 70px #0004}dialog::backdrop{background:#0005}label{display:block;margin:13px 0 6px;font-size:13px}select,input[type=color]{width:100%;padding:8px}footer{font-size:12px;color:#888;text-align:center;margin-top:36px}</style></head><body><header><div class="logo">🧠</div><div><h1>Brain</h1><div class="muted">A place for everything on your mind</div></div></header><main id="main"></main><dialog id="editDialog"><h2>Customize tile</h2><label>Tile name</label><input id="editName" type="text" maxlength="35"><label>Emoji</label><input id="editEmoji" type="text" maxlength="8"><label>Tile color</label><input id="editColor" type="color"><label>Tile size</label><select id="editSize"><option value="1">Regular</option><option value="2">Wide (2 tiles)</option></select><div class="toolbar"><button class="pill" id="cancelEdit">Cancel</button><button class="pill" id="saveEdit">Save</button></div></dialog><script>const KEY='brain-v1-data';const defaults=[{id:'shopping',name:'Shopping',emoji:'🛒',color:'#e4e6fb',size:1,items:[]},{id:'todo',name:'To-Do',emoji:'✅',color:'#dcefe6',size:1,items:[]}];let lists;try{lists=JSON.parse(localStorage.getItem(KEY))||structuredClone(defaults)}catch{lists=structuredClone(defaults)}let active=null,editing=null;const main=document.getElementById('main');const persist=()=>localStorage.setItem(KEY,JSON.stringify(lists));function el(tag,cls,txt){const n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=txt;return n}function render(){main.replaceChildren();if(!active){const toolbar=el('div','toolbar');toolbar.append(el('strong',null,'My lists'));const add=el('button','pill','+ New list');add.onclick=()=>{const id='list-'+Date.now();lists.push({id,name:'New list',emoji:'📝',color:'#eee5fb',size:1,items:[]});persist();openEdit(id)};toolbar.append(add);main.append(toolbar);const grid=el('div','tiles');lists.forEach(l=>{const t=el('button','tile');t.style.background=l.color;t.style.gridColumn=l.size===2?'span 2':'span 1';const emoji=el('div','emoji',l.emoji),name=el('div',null,l.name),count=el('small',null,l.items.filter(i=>!i.done).length+' remaining');t.append(emoji,name,count);t.onclick=()=>{active=l.id;render()};let timer,held=false;t.addEventListener('pointerdown',()=>{held=false;timer=setTimeout(()=>{held=true;openEdit(l.id)},650)});['pointerup','pointerleave','pointercancel'].forEach(ev=>t.addEventListener(ev,()=>clearTimeout(timer)));t.addEventListener('click',e=>{if(held){e.stopImmediatePropagation();active=null;render()}},true);grid.append(t)});main.append(grid);const hint=el('p','muted','Press and hold a tile to customize it.');main.append(hint)}else{const l=lists.find(x=>x.id===active);if(!l){active=null;render();return}const back=el('button','back','← All lists');back.onclick=()=>{active=null;render()};main.append(back,el('h2',null,l.emoji+' '+l.name));const entry=el('form','entry');const input=el('input');input.type='text';input.placeholder='Add an item…';input.required=true;input.setAttribute('aria-label','New list item');const add=el('button',null,'Add');add.type='submit';entry.append(input,add);entry.onsubmit=e=>{e.preventDefault();const text=input.value.trim();if(!text)return;l.items.unshift({id:Date.now()+'-'+Math.random(),text,done:false});persist();render()};main.append(entry);if(!l.items.length)main.append(el('div','empty','Nothing here yet. Add your first item!'));[...l.items].sort((a,b)=>Number(a.done)-Number(b.done)).forEach(item=>{const row=el('div','item'+(item.done?' done':''));const check=el('input');check.type='checkbox';check.checked=item.done;check.setAttribute('aria-label','Complete '+item.text);check.onchange=()=>{item.done=check.checked;persist();render()};const name=el('span',null,item.text);const del=el('button',null,'×');del.setAttribute('aria-label','Delete '+item.text);del.onclick=()=>{if(confirm('Delete this item?')){l.items=l.items.filter(x=>x.id!==item.id);persist();render()}};row.append(check,name,del);main.append(row)})}}function openEdit(id){editing=id;const l=lists.find(x=>x.id===id);document.getElementById('editName').value=l.name;document.getElementById('editEmoji').value=l.emoji;document.getElementById('editColor').value=l.color;document.getElementById('editSize').value=l.size;document.getElementById('editDialog').showModal()}document.getElementById('cancelEdit').onclick=()=>document.getElementById('editDialog').close();document.getElementById('saveEdit').onclick=()=>{const l=lists.find(x=>x.id===editing);l.name=document.getElementById('editName').value.trim()||l.name;l.emoji=document.getElementById('editEmoji').value.trim()||'📝';l.color=document.getElementById('editColor').value;l.size=Number(document.getElementById('editSize').value);persist();document.getElementById('editDialog').close();render()};render();</script><footer>Brain v1.1 • Your lists are saved in this browser on this device.</footer></body></html>
